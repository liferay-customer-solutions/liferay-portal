name: Sync Upstream Master

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync_to_upstream:
    runs-on: ubuntu-latest
    name: Syncing with upstream repository

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Add Upstream Remote
        run: git remote add upstream https://github.com/liferay/liferay-portal.git

      - name: Fetch Upstream
        run: git fetch upstream

      - name: Rebase from Upstream
        run: git rebase upstream/master

      - name: Push to Fork
        run: git push --force-with-lease