name: liferay-partner-workspace
services:
    cron:
        build: ../client-extensions/liferay-partner-etc-cron/build/liferay-client-extension-build
        container_name: liferay-partner-workspace-cron
        depends_on:
            - liferay
        env_file: cron.env
        volumes:
            - routes-cron:/etc/liferay/lxc/ext-init-metadata
            - routes-dxp:/etc/liferay/lxc/dxp-metadata
    database:
        command: mysqld --character-set-filesystem=utf8 --character-set-server=utf8 --collation-server=utf8_general_ci --max_allowed_packet=32M
        container_name: liferay-partner-workspace-database
        deploy:
            resources:
                limits:
                    memory: 1G
                reservations:
                    memory: 1G
        env_file: database.env
        healthcheck:
            interval: 5s
            retries: 10
            start_period: 5s
            test: mysql --execute="select 1" --host=localhost --password=$$MYSQL_ROOT_PASSWORD --protocol=tcp --user=root 2>&1 | grep -qvF "Can't connect"
        image: mysql:5.7
        ports:
            - 3306:3306
    liferay:
        container_name: liferay-partner-workspace-liferay
        depends_on:
            database:
                condition: service_healthy
        env_file: liferay.env
        image: liferay/dxp:2024.q2.6
        ports:
            - 8000:8000
            - 8080:8080
        volumes:
            - ../bundles/osgi/client-extensions:/opt/liferay/osgi/client-extensions
            - routes-cron:/opt/liferay/routes/default/liferay-partner-etc-cron
            - routes-dxp:/opt/liferay/routes/default/dxp
            - routes-spring-boot:/opt/liferay/routes/default/liferay-partner-etc-spring-boot
    mock-app:
        build: ./mock-app
        container_name: liferay-partner-workspace-mock-app
        env_file: mock-app.env
        ports:
            - 3001:3001
    rabbitmq:
        container_name: liferay-partner-workspace-rabbitmq
        image: rabbitmq:3-management-alpine
        ports:
            - 5672:5672
            - 15672:15672
        env_file: rabbitmq.env
        volumes:
            - ./rabbitmq-partner.conf:/etc/rabbitmq/conf.d/rabbitmq-partner.conf
            - ./rabbitmq-defs.json:/etc/rabbitmq/rabbitmq-defs.json
    spring-boot:
        build: ../client-extensions/liferay-partner-etc-spring-boot/build/liferay-client-extension-build
        container_name: liferay-partner-workspace-spring-boot
        depends_on:
            - liferay
        env_file: spring-boot.env
        volumes:
            - routes-dxp:/etc/liferay/lxc/dxp-metadata
            - routes-spring-boot:/etc/liferay/lxc/ext-init-metadata
volumes:
    routes-cron:
    routes-dxp:
    routes-spring-boot: